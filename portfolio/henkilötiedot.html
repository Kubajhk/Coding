<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henkilötiedot</title>

    <link rel="stylesheet" href="henkil.css">
</head>

<body>

    <header>
        <h1>Henkilötiedot</h1>
    </header>

    <nav>
        <a href="../portfolio/index.html">Porfolio</a>
        <a href="../index.html">Etusivu</a>
        <a href="../tyokokemus.html">Työkokemus</a>
    </nav>

    <main>

        <h1>Henkilötiedot</h1>

        <table>
            <thead>
                <tr>
                    <th>Nimi</th>
                    <th>Ikä</th>
                    <th>Työ</th>
                    <th>Ajokortti</th>
                </tr>
            </thead>

            <tbody id="rivit"></tbody>
        </table>

        <h2>Lisää henkilö</h2>

        <form id="lomake">

            <div>
                <label for="nimi">Nimi:</label>
                <input type="text" id="nimi" required>
            </div>

            <div>
                <label for="ika">Ikä:</label>
                <input type="number" id="ika" required>
            </div>

            <div>
                <label for="tyo">Työ:</label>
                <input type="text" id="tyo" required>
            </div>

            <div>
                <label for="ajokortti">Ajokortti:</label>
                <input type="checkbox" id="ajokortti">
            </div>

            <button type="submit">Lähetä</button>

        </form>

    </main>

    <footer>
        <p>kub26TAI</p>
    </footer>

    <script src="henkilot.js"></script>

</body>
</html>
